# linux-*musl native addon linking config. [target.<triple>.*] applies only
# when <triple> is the active build target — gnu/darwin/windows are clear.
# Per-target [rustflags] takes cargo precedence over the inherited RUSTFLAGS
# env, so emnapi's -D warnings / -crt-static (appended for *musl) are ignored
# for musl legs here.
#
# Both musl targets: rust-std ships a complete self-contained runtime
# (Scrt1.o, libc.a, libunwind.a); rust-lld links a static, dlopen-safe cdylib.
# `-linker` is a no-op on *musl (gnu-only granular flag) but keeps the config
# block non-empty, which makes cargo honor [rustflags] and ignore the RUSTFLAGS
# env — so emnapi's -crt-static (dynamic, which emits -lgcc_s) is blocked in
# favor of the default static CRT. No musl-tools / musl-gcc needed.
[target.x86_64-unknown-linux-musl]
rustflags = ["-C", "link-self-contained=-linker"]

[target.aarch64-unknown-linux-musl]
rustflags = ["-C", "link-self-contained=-linker"]