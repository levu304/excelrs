# *-musl native addon linking. The Build step sets
# RUSTFLAGS="-C target-feature=-crt-static ..." which forces rustc off
# self-contained -> external `musl-gcc` (musl-tools). rust 1.97.1 drops the
# `cdylib` crate type under self-contained, so the external musl-gcc path is
# mandatory. musl-tools ships a static libc.a + libgcc.a, and
# `-static-libgcc` (link-arg) forces libgcc.a over libgcc_s.so.1, producing a
# fully static, dlopen-safe .so (no libc.so.6 / libgcc_s.so.1 runtime deps).
[target.x86_64-unknown-linux-musl]
linker = "musl-gcc"

[target.aarch64-unknown-linux-musl]
linker = "musl-gcc"