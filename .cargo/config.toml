# linux-*musl native addon linking config. [target.<triple>.*] applies only
# when <triple> is the active build target; gnu/darwin/windows are clear.
# Cargo [target.<triple>.rustflags] takes precedence over the RUSTFLAGS env,
# so the flags set here win for the plain `cargo build` step (no emnapi
# -crt-static interference in that step).
#
# Musl legs use external musl-gcc (musl-tools), which ships a complete static
# runtime (Scrt1.o, libc.a) that rust-std's self-contained bundle is flaky
# about (missing Scrt1.o -> "does not support cdylib"). musl-gcc +
# +crt-static + link-self-contained=no + -static-libgcc -> fully static,
# dlopen-safe .so (no libgcc_s.so.1 / libc.so runtime deps on host).
[target.x86_64-unknown-linux-musl]
linker = "musl-gcc"
rustflags = [
  "-C", "link-self-contained=no",
  "-C", "target-feature=+crt-static",
  "-C", "link-arg=-static-libgcc",
  "-C", "link-arg=-s",
]

[target.aarch64-unknown-linux-musl]
linker = "musl-gcc"
rustflags = [
  "-C", "link-self-contained=no",
  "-C", "target-feature=+crt-static",
  "-C", "link-arg=-static-libgcc",
  "-C", "link-arg=-s",
]