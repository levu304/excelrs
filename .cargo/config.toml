# *-musl cdylib. We build via cargo-zigbuild (napi build --cross-compile),
# which links musl libc through zig's bundled lld — fast, and avoids the
# musl-gcc/bfd link hang that wedged CI at 45m. RUSTFLAGS (Build step) carries
# `-C target-feature=-crt-static` (crt-static OFF) so rustc links musl libc
# *dynamically* (NEEDED libc.musl-*.so.1) — a fully-static musl cdylib
# segfaults on dlopen (static TLS/pthread init collides with host libc), so
# the Assert musl step in release.yml fails the build if linkage regresses.