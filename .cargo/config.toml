# *-musl cdylib. rust-lld self-contained DROPS the cdylib crate type on
# *-musl (rust 1.97.1), so a musl cdylib must link via an external musl
# toolchain. We point the linker at `scripts/musl-gcc` (on PATH via the Build
# step): a thin wrapper over musl-gcc that links musl libc *dynamically*
# (NEEDED libc.musl-*.so.1) so the .node dlopen's cleanly on musl hosts.
# The actual link uses mold (via -C link-arg=-fuse-ld=mold in the Build step)
# instead of bfd — bfd wedged CI at 45m; mold links in seconds.
[target.x86_64-unknown-linux-musl]
linker = "musl-gcc"

[target.aarch64-unknown-linux-musl]
linker = "musl-gcc"