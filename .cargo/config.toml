# linux-*musl native addon linking. The Build step runs a plain
# `cargo build --target <triple>` (NOT emnapi), so emnai's
# `-C target-feature=-crt-static` RUSTFLAGS env is never introduced.
#
# rust-std's default for *-musl is self-contained rust-lld (bundled libc.a +
# Scrt1.o + libunwind.a), which links a static, dlopen-safe cdylib with no
# external toolchain. No musl-tools / musl-gcc needed. `rustup target add` in
# the workflow force-downloads a complete rust-std (self-contained Scrt1.o) so
# cargo doesn't hit "does not support these crate types".