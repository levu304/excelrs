# linux-*musl native addon linking. Build step runs plain `cargo build` (not
# emnapi), so the -crt-static RUSTFLAGS env is never introduced.
[target.x86_64-unknown-linux-musl]
# `-linker` is a stable no-op on *musl (gnu-only granular flag) but keeps
# [rustflags] non-empty, so cargo honors config over any RUSTFLAGS env and
# uses rust-lld self-contained -> static, dlopen-safe cdylib.
rustflags = ["-C", "link-self-contained=-linker"]

[target.aarch64-unknown-linux-musl]
rustflags = ["-C", "link-self-contained=-linker"]